name: release

# Push a tag matching package.json version (e.g. v0.2.0):
#   git tag v0.2.0 && git push origin v0.2.0
# Builds the frontend, bundles the engine binaries listed in package.json "remote_binary"
# (verifying their SHA-256, like the Decky store CI does) and publishes an installable zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(jq -r .version package.json)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$V"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Fetch engine binaries (remote_binary)
        run: |
          mkdir -p bin
          jq -c '.remote_binary[]' package.json | while read -r b; do
            name=$(echo "$b" | jq -r .name); url=$(echo "$b" | jq -r .url); sha=$(echo "$b" | jq -r .sha256hash)
            curl -sSfL -o "bin/$name" "$url"
            echo "$sha  bin/$name" | sha256sum -c -
            chmod 755 "bin/$name"
          done

      - name: Pack plugin
        run: bash scripts/make-release.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/decky-voice-input.zip
