name: engine

# Builds whisper-server for Steam Deck and publishes it as a release the plugin downloads from.
#   git tag engine-v1 && git push origin engine-v1
# The tag must match ENGINE_TAG in main.py.
on:
  push:
    tags: ["engine-v*"]
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: "whisper.cpp git ref"
        default: "master"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - variant: cpu
            image: debian:bookworm
          - variant: vulkan
            image: ubuntu:24.04
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - name: Build whisper-server (${{ matrix.variant }})
        run: VARIANT=${{ matrix.variant }} bash scripts/build-whisper-inner.sh "${{ github.event.inputs.whisper_ref || 'master' }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.variant }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Checksums
        working-directory: art
        run: |
          chmod 755 whisper-server-*
          sha256sum whisper-server-cpu whisper-server-vulkan > SHA256SUMS
          cat SHA256SUMS whisper.cpp.version
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Engine ${{ github.ref_name }}"
          body: "Prebuilt whisper.cpp server for Voice Input (Steam Deck). Built by CI from upstream sources, MIT licensed."
          files: |
            art/whisper-server-cpu
            art/whisper-server-vulkan
            art/SHA256SUMS
            art/LICENSE-whisper.cpp
            art/whisper.cpp.version
